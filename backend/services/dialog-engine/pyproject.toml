[project]
name = "my-robot-dialog-engine"
version = "0.1.0"
description = "对话编排 + WS 流式 + 场景配置 + 安全风控 + 反馈"
requires-python = ">=3.12"
dependencies = [
    "my-robot-common",
    "my-robot-skills",
    "PyYAML>=6.0.1",
    "httpx>=0.27.0",
]

[tool.uv.sources]
my-robot-common = { workspace = true }
my-robot-skills = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dialog_engine"]
