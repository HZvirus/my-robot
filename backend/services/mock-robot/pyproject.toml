[project]
name = "my-robot-mock-robot"
version = "0.1.0"
description = "mock-robot：订阅 robot/+/+/cmd 打日志，验证指令链路"
requires-python = ">=3.12"
dependencies = [
    "my-robot-common",
    "aiomqtt>=2.0.0",
]

[tool.uv.sources]
my-robot-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mock_robot"]
