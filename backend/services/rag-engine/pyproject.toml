[project]
name = "my-robot-rag-engine"
version = "0.1.0"
description = "知识库检索（pgvector + 离线确定性 embedding）"
requires-python = ">=3.12"
dependencies = [
    "my-robot-common",
    "pgvector>=0.3.0",
]

[tool.uv.sources]
my-robot-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_engine"]
