[project]
name = "my-robot-user-tenant"
version = "0.1.0"
description = "用户/租户/鉴权服务"
requires-python = ">=3.12"
dependencies = [
    "my-robot-common",
]

[tool.uv.sources]
my-robot-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/user_tenant"]
