[project]
name = "my-robot-skills"
version = "0.1.0"
description = "技能插件骨架：Skill 基类 + 注册装饰器 + 示例技能"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/my_robot_skills"]
