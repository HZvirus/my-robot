[project]
name = "my-robot-backend"
version = "0.1.0"
description = "机器人平台后端 monorepo（uv workspaces）"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.uv.workspace]
members = ["libs/*", "services/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["libs", "services"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
