_format_version: "3.0"

services:
  - name: user-tenant
    url: http://user-tenant:8200
    routes:
      - name: auth-route
        paths: ["/api/auth"]
        strip_path: true
      - name: users-route
        paths: ["/api/users"]
        strip_path: true
      - name: tenants-route
        paths: ["/api/tenants"]
        strip_path: true

  - name: dialog-engine
    url: http://dialog-engine:8100
    routes:
      - name: feedback-route
        paths: ["/api/feedback"]
        strip_path: false
        methods: [POST, OPTIONS]
      - name: chat-ws-route
        paths: ["/ws/chat"]
        strip_path: false
        protocols: [http, https]

  - name: model-gateway
    url: http://model-gateway:8300
    routes:
      - name: v1-route
        paths: ["/v1"]
        strip_path: false

  - name: rag-engine
    url: http://rag-engine:8400
    routes:
      - name: rag-collections-route
        paths: ["/api/collections"]
        strip_path: true
      - name: rag-documents-route
        paths: ["/api/documents"]
        strip_path: true
      - name: rag-retrieve-route
        paths: ["/api/retrieve"]
        strip_path: true

  - name: task-executor
    url: http://task-executor:8500
    routes:
      - name: tasks-route
        paths: ["/api/tasks"]
        strip_path: true

plugins:
  - name: cors
    config:
      origins: ["*"]
      methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
      headers: ["*"]
      credentials: false
      max_age: 3600
  - name: rate-limiting
    config:
      minute: 600
      policy: redis
      redis_host: redis
      redis_port: 6379
      redis_timeout: 2000
      limit_by: ip
      fault_tolerant: true
